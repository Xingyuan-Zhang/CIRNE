[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cirne-registration"
version = "0.1.0"
description = "Patchwise instance-mask-guided nonrigid registration for spatial imaging"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Xingyuan Zhang"},
]
keywords = ["image registration", "spatial transcriptomics", "instance segmentation", "nonrigid registration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "tifffile>=2022.8.12",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cirne-register = "cirne.cli:main"

[project.urls]
Homepage = "https://github.com/Xingyuan-Zhang/CIRNE"
Repository = "https://github.com/Xingyuan-Zhang/CIRNE"
Issues = "https://github.com/Xingyuan-Zhang/CIRNE/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
